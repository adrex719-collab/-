<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ایمن بندر</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#17202a}.top{padding:20px;background:#17324d;color:white}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.badge{padding:5px 9px;border-radius:8px;background:#e8eef5}.muted{color:#667}</style></head>
<body><div class="top"><div class="wrap"><h1>ایمن بندر</h1><div>دموی اجرایی — PTW</div></div></div>
<main class="wrap"><div class="card"><h2>مجوزهای کار</h2><div id="app">در حال بارگذاری...</div></div></main>
<script>
fetch('./data/ptw-demo.json').then(r=>r.json()).then(d=>{
 const root=document.getElementById('app');
 root.innerHTML='<p><b>وضعیت:</b> '+d.mode+' — <b>داده:</b> '+d.data_classification+'</p>'+
 d.permits.map(p=>'<div class="card"><b>'+p.id+'</b><br>نوع: '+p.type+'<br>محل: '+p.location+'<br>وضعیت: <span class="badge">'+p.status+'</span></div>').join('');
}).catch(e=>document.getElementById('app').textContent='خطا در بارگذاری JSON: '+e);
</script></body></html>
