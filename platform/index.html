<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ایمن بندر — Development Dashboard</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}.top{padding:22px;background:#17324d;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.kpi{font-size:26px;font-weight:700}.muted{color:#68737d}.ok{color:#087443;font-weight:700}.work{color:#9a6700;font-weight:700}.bad{color:#b42318;font-weight:700}.badge{display:inline-block;padding:5px 9px;border-radius:8px;background:#e8eef5;margin:3px}.bar{height:10px;background:#e5e7eb;border-radius:8px;overflow:hidden}.fill{height:100%;background:#198754}.actions{display:flex;flex-wrap:wrap;gap:5px}button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;background:#17324d;color:#fff}button.secondary{background:#68737d}button:disabled{opacity:.4;cursor:not-allowed}.log{font-family:monospace;background:#101820;color:#d7e2ea;border-radius:10px;padding:12px;white-space:pre-wrap;max-height:180px;overflow:auto}
</style></head>
<body><header class="top"><div class="wrap"><h1>ایمن بندر</h1><div>داشبورد توسعه و اجرای پلتفرم — PTW Vertical Slice</div></div></header>
<main class="wrap">
<section class="grid" id="summary"></section>
<section class="card"><h2>مسیر توسعه</h2><div id="roadmap"></div></section>
<section class="card"><h2>چرخه اجرایی PTW</h2><div class="muted">این صفحه DEMO است؛ تغییرات در مرورگر نگهداری می‌شوند و به دیتابیس واقعی متصل نیستند.</div><div id="permits">در حال بارگذاری...</div></section>
<section class="card"><h2>گیت‌های معماری و Runtime</h2><div id="gates"></div></section>
<section class="card"><h2>Audit Log — اجرای همین مرورگر</h2><div id="log" class="log">بدون رویداد</div><button class="secondary" onclick="resetDemo()">بازنشانی Demo</button></section>
</main>
<script>
let seed,permits,logs=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={REQUESTED:'درخواست‌شده',PENDING_APPROVAL:'در انتظار تأیید',ISSUED:'صادرشده',ACTIVE:'فعال',SUSPENDED:'معلق',RESUMED:'ادامه‌یافته',CLOSED:'بسته‌شده'};
function can(p,a){if(a==='approve')return p.status==='REQUESTED';if(a==='issue')return p.status==='PENDING_APPROVAL'&&p.authorizationApproved;if(a==='activate')return p.status==='ISSUED'&&p.authorizationApproved&&(!p.requiresLoto||p.lotoApplied)&&(!p.requiredGasTest||p.gasTestPassed);if(a==='suspend')return ['ACTIVE','RESUMED'].includes(p.status);if(a==='resume')return p.status==='SUSPENDED';if(a==='loto')return p.requiresLoto&&['ISSUED','SUSPENDED','RESUMED'].includes(p.status)&&!p.lotoApplied;if(a==='gas')return p.requiredGasTest&&!p.gasTestPassed&&['ISSUED','SUSPENDED','RESUMED'].includes(p.status);if(a==='release')return p.requiresLoto&&p.lotoApplied&&['SUSPENDED','RESUMED','ACTIVE'].includes(p.status);if(a==='close')return ['ACTIVE','RESUMED'].includes(p.status)&&(!p.requiresLoto||p.lotoReleased);return false}
function act(id,a){const p=permits.find(x=>x.id===id);if(!can(p,a)){logs.unshift('DENY  '+id+'  '+a);render();return}
if(a==='approve'){p.authorizationApproved=true;p.status='PENDING_APPROVAL'}
if(a==='issue')p.status='ISSUED'
if(a==='loto')p.lotoApplied=true
if(a==='gas')p.gasTestPassed=true
if(a==='activate')p.status='ACTIVE'
if(a==='suspend')p.status='SUSPENDED'
if(a==='resume')p.status='RESUMED'
if(a==='release')p.lotoReleased=true
if(a==='close')p.status='CLOSED'
logs.unshift('ALLOW '+id+'  '+a+'  → '+p.status);save();render()}
function save(){localStorage.setItem('eiman-ptw-demo',JSON.stringify({permits,logs}))}
function resetDemo(){localStorage.removeItem('eiman-ptw-demo');permits=structuredClone(seed.permits);logs=[];render()}
function button(id,a,text){const p=permits.find(x=>x.id===id);return '<button '+(can(p,a)?'':'disabled')+' onclick="act(\''+id+'\',\''+a+'\')">'+text+'</button>'}
function render(){
document.getElementById('summary').innerHTML=[['نسخه','V26'],['مرحله','PTW Vertical Slice'],['معماری','FROZEN'],['محیط','DEMO']].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="kpi">'+x[1]+'</div></div>').join('');
const done=4,pct=67;document.getElementById('roadmap').innerHTML='<p><b>گیت‌های پایه: '+done+'/6 — '+pct+'٪</b></p><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><p class="muted">چرخه: Request → Authorization → Issue → LOTO/Gas → Activate → Suspend/Resume → Release → Close</p>';
document.getElementById('permits').innerHTML=permits.map(p=>'<div class="card"><b>'+esc(p.id)+'</b> <span class="badge">'+esc(labels[p.status]||p.status)+'</span><br>نوع: '+esc(p.type)+' — محل: '+esc(p.location)+'<br><span class="muted">Authorization: '+(p.authorizationApproved?'✓':'—')+' | LOTO: '+(p.lotoApplied?'Applied':'—')+(p.lotoReleased?' / Released':'')+' | Gas: '+(p.gasTestPassed?'PASS':'—')+'</span><div class="actions" style="margin-top:10px">'+button(p.id,'approve','تأیید صلاحیت')+button(p.id,'issue','صدور مجوز')+button(p.id,'loto','اعمال LOTO')+button(p.id,'gas','ثبت Gas PASS')+button(p.id,'activate','فعال‌سازی')+button(p.id,'suspend','تعلیق')+button(p.id,'resume','ادامه کار')+button(p.id,'release','آزادسازی LOTO')+button(p.id,'close','بستن مجوز')+'</div></div>').join('');
document.getElementById('gates').innerHTML=['Target Architecture ✓ PASS','PTW Contract ✓ PASS','LOTO Dependency ✓ PASS','Authorization Boundary ✓ PASS','Workflow Boundary ✓ PASS','Runtime Scenario → اجرای تعاملی'].map(x=>'<div><span class="badge">'+x+'</span></div>').join('');
document.getElementById('log').textContent=logs.length?logs.join('\n'):'بدون رویداد';
}
fetch('./data/ptw-demo.json').then(r=>r.json()).then(d=>{seed=d;const saved=JSON.parse(localStorage.getItem('eiman-ptw-demo')||'null');permits=saved?.permits||structuredClone(d.permits);logs=saved?.logs||[];render()}).catch(e=>document.getElementById('permits').textContent='خطا: '+e);
</script></body></html>
