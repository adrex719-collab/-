<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ایمن بندر — Development Dashboard</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}.top{padding:22px;background:#17324d;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.kpi{font-size:28px;font-weight:700}.muted{color:#68737d}.ok{color:#087443;font-weight:700}.work{color:#9a6700;font-weight:700}.badge{display:inline-block;padding:5px 9px;border-radius:8px;background:#e8eef5;margin:3px}.bar{height:10px;background:#e5e7eb;border-radius:8px;overflow:hidden}.fill{height:100%;background:#198754}button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;background:#17324d;color:#fff;margin:4px}</style></head><body><header class="top"><div class="wrap"><h1>ایمن بندر</h1><div>داشبورد توسعه و اجرای پلتفرم</div></div></header><main class="wrap"><section class="grid" id="summary"></section><section class="card"><h2>مسیر توسعه</h2><div id="roadmap"></div></section><section class="card"><h2>PTW — وضعیت فعلی</h2><div id="permits">در حال بارگذاری...</div></section><section class="card"><h2>گیت‌های معماری و Runtime</h2><div id="gates"></div></section><section class="card"><h2>کنترل اجرا</h2><button onclick="location.reload()">بازخوانی وضعیت</button></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));Promise.all([fetch('./data/dev-status.json').then(r=>r.json()),fetch('./data/ptw-demo.json').then(r=>r.json())]).then(([d,p])=>{document.getElementById('summary').innerHTML=[['نسخه',d.version],['مرحله',d.current_stage],['معماری',d.architecture.status],['محیط',d.environment]].map(x=>'<div class="card"><div class="muted">'+esc(x[0])+'</div><div class="kpi">'+esc(x[1])+'</div></div>').join('');const done=d.gates.filter(x=>x.status==='PASS').length,pct=Math.round(done/d.gates.length*100);document.getElementById('roadmap').innerHTML='<p><b>پیشرفت گیت‌ها: '+pct+'٪</b></p><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><p class="muted">هر مرحله قبل از عبور به Domain بعدی باید Gate شود.</p>';document.getElementById('gates').innerHTML=d.gates.map(g=>'<div><span class="badge">'+esc(g.name)+'</span> <span class="'+(g.status==='PASS'?'ok':'work')+'">'+esc(g.status)+'</span></div>').join('');document.getElementById('permits').innerHTML='<p><b>داده:</b> '+esc(p.data_classification)+' — <b>حالت:</b> '+esc(p.mode)+'</p>'+p.permits.map(x=>'<div class="card"><b>'+esc(x.id)+'</b><br>نوع: '+esc(x.type)+'<br>محل: '+esc(x.location)+'<br>وضعیت: <span class="badge">'+esc(x.status)+'</span></div>').join('');}).catch(e=>document.getElementById('permits').textContent='خطا در بارگذاری داده‌ها: '+e);</script></body></html>
